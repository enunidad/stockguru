<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>StockGuru - Stock Analyzer</title>

    <link
        rel="stylesheet"
        href="/static/theme.css"
    >

    <link
        rel="stylesheet"
        href="/static/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

    <script
        src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"
        defer
    ></script>

    <script
        src="/static/sidebar.js"
        defer
    ></script>

    <script
        src="/static/app.js"
        defer
    ></script>
</head>

<body>

    <div class="app-shell">

        <!-- ==================================================
             Sidebar
             ================================================== -->
        <aside
            class="app-sidebar"
            id="app-sidebar"
        >

            <div class="sidebar-header">

                <a
                    href="/"
                    class="sidebar-brand"
                    aria-label="StockGuru home"
                >
                    <div class="brand-mark">
                        SG
                    </div>

                    <span class="brand-name">
                        StockGuru
                    </span>
                </a>

                <button
                    class="sidebar-toggle"
                    id="sidebar-toggle"
                    type="button"
                    aria-label="Toggle navigation"
                    aria-expanded="true"
                >
                    <span class="toggle-icon">
                        ☰
                    </span>
                </button>

            </div>


            <nav class="sidebar-nav">

                <a
                    href="/"
                    class="sidebar-link"
                    title="Home"
                >
                    <span class="sidebar-icon">
                        ⌂
                    </span>

                    <span class="sidebar-label">
                        Home
                    </span>
                </a>


                <a
                    href="/analyzer"
                    class="sidebar-link active"
                    title="Stock Analyzer"
                >
                    <span class="sidebar-icon">
                        ↗
                    </span>

                    <span class="sidebar-label">
                        Stock Analyzer
                    </span>
                </a>


                <a
                    href="/forecaster"
                    class="sidebar-link"
                    title="Portfolio Forecaster"
                >
                    <span class="sidebar-icon">
                        ◴
                    </span>

                    <span class="sidebar-label">
                        Portfolio Forecaster
                    </span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <a
                    href="/about"
                    class="sidebar-link sidebar-secondary-link"
                    title="About"
                >
                    <span class="sidebar-icon">
                        i
                    </span>

                    <span class="sidebar-label">
                        About
                    </span>
                </a>

                <a
                    href="/docs"
                    class="sidebar-link sidebar-secondary-link"
                    title="Docs"
                >
                    <span class="sidebar-icon">
                        ≡
                    </span>

                    <span class="sidebar-label">
                        Docs
                    </span>
                </a>

            </div>

        </aside>


        <!-- ==================================================
             Stock Analyzer
             ================================================== -->
        <main class="app-container">

            <header class="app-brand">
                <img
                    src="/static/logo.png"
                    alt="StockGuru"
                    class="brand-logo"
                >
            </header>


            <div class="top-layout">

                <section class="search-panel panel">

                    <form
                        id="stock-form"
                        class="search-form"
                    >

                        <label for="ticker">
                            Ticker symbol
                        </label>

                        <div class="search-controls">

                            <input
                                id="ticker"
                                name="ticker"
                                type="text"
                                placeholder="For example: AAPL or BCE.TO"
                                autocomplete="off"
                                required
                            >

                            <button type="submit">
                                Analyze
                            </button>

                        </div>

                    </form>

                    <p
                        id="status"
                        class="status-message"
                        aria-live="polite"
                    ></p>

                </section>


                <section
                    id="metadata-section"
                    class="metadata-panel panel"
                    hidden
                >

                    <div class="section-heading">
                        <h2>
                            Company Information
                        </h2>
                    </div>

                    <div class="metadata-grid">

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Company
                            </span>

                            <span id="company-name">
                                —
                            </span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Ticker
                            </span>

                            <span id="metadata-ticker">
                                —
                            </span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Currency
                            </span>

                            <span id="currency">
                                —
                            </span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Exchange
                            </span>

                            <span id="exchange">
                                —
                            </span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Country
                            </span>

                            <span id="country">
                                —
                            </span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">
                                Industry
                            </span>

                            <span id="industry">
                                —
                            </span>
                        </div>

                    </div>

                </section>

            </div>


            <section
                id="results-section"
                class="results-layout"
                hidden
            >

                <div class="history-panel panel">

                    <div class="section-heading">

                        <div>

                            <h2>
                                Historical Prices
                            </h2>

                            <p id="history-description">
                                Historical market data
                            </p>

                        </div>

                    </div>

                    <div
                        id="price-history-chart"
                        class="price-history-chart"
                    ></div>

                </div>


                <aside class="metrics-panel panel">

                    <div class="section-heading">
                        <h2>
                            Metrics
                        </h2>
                    </div>

                    <div class="metrics-list">

                        <div class="metric-item">

                            <span class="metric-label">
                                CAGR
                            </span>

                            <strong id="cagr">
                                —
                            </strong>

                        </div>

                        <div class="metric-item">

                            <span class="metric-label">
                                Volatility
                            </span>

                            <strong id="volatility">
                                —
                            </strong>

                        </div>

                        <div class="metric-item">

                            <span class="metric-label">
                                Max Drawdown
                            </span>

                            <strong id="max-drawdown">
                                —
                            </strong>

                        </div>

                        <div class="metric-item">

                            <span class="metric-label">
                                50-Day SMA
                            </span>

                            <strong id="sma">
                                —
                            </strong>

                        </div>

                        <div class="metric-item">

                            <span class="metric-label">
                                200-Day SMA
                            </span>

                            <strong id="ema">
                                —
                            </strong>

                        </div>

                    </div>

                </aside>

            </section>

        </main>

    </div>

</body>

</html>
